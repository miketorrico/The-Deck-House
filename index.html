#site>.hero,#site>.strip,#site>.about,#site>main{transition:opacity .4s}
.art img,.pc.im img{opacity:0;transition:opacity .45s ease}.art img.ok,.pc.im img.ok{opacity:1}
.pc.im{background:linear-gradient(145deg,#6b1a28,#1a060b)}

header{background:var(--black);border-bottom:2px solid var(--gold)}
.tp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px clamp(16px,4vw,48px)}
.tp nav{display:flex;gap:26px}.tp nav a{color:var(--cream);text-decoration:none;font-weight:700;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase}.tp nav a:hover{color:var(--gold2)}
.tpb{display:flex;align-items:center;gap:12px;justify-self:center}
.tpb img{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold)}
.tpb span{font:800 clamp(1.15rem,3vw,1.7rem)/1 Cinzel,Georgia,serif;letter-spacing:.08em;color:var(--gold);white-space:nowrap;text-transform:uppercase;text-shadow:0 2px 8px #000}
.tp .acts{justify-self:end;display:flex;gap:8px}
.tp .ib{position:relative;background:none;border:0;border-radius:0;color:var(--cream);padding:6px;cursor:pointer}
.tp .ib svg{width:24px;height:24px;display:block}
.tp .ib b{position:absolute;top:-2px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--black);font-size:.7rem;display:flex;align-items:center;justify-content:center}
.hx{display:grid;grid-template-columns:1.35fr 1fr;height:min(78vh,660px);min-height:460px;background:linear-gradient(120deg,#000,var(--wine) 140%)}
.hx-st{position:relative;overflow:hidden;background:#000}
.hx-st::after{content:"";position:absolute;top:0;right:0;bottom:0;width:90px;z-index:4;background:linear-gradient(90deg,transparent,rgba(10,5,6,.94));pointer-events:none}
.hx-sl{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;overflow:hidden}
.hx-sl.on{opacity:1;z-index:2}.hx-sl.prev{opacity:0;z-index:1}
.hx-im{position:absolute;inset:0;transform-origin:center}
.hx-sl.on .hx-im,.hx-sl.prev .hx-im{animation:hxkb 5.6s ease-in-out forwards}
@keyframes hxkb{from{transform:scale(1)}to{transform:scale(1.13)}}
.hx-im img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.hx-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.hx-box{width:min(40%,300px);aspect-ratio:3/4.2;border:3px solid var(--gold);border-radius:10px;transform:rotate(-7deg);box-shadow:14px 18px 40px #000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--gold);text-align:center;padding:14px}
.hx-box b{font-size:clamp(2.6rem,7vw,4.6rem);line-height:1}.hx-box small{font:800 clamp(.7rem,1.6vw,1rem) Cinzel,Georgia,serif;letter-spacing:.12em}
.hx-ar{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:50px;height:50px;border-radius:50%;border:1px solid #fff8;background:#0007;color:#fff;font-size:1.5rem;cursor:pointer;padding:0}
.hx-ar:hover{border-color:var(--gold);color:var(--gold2)}.hx-ar.l{left:20px}.hx-ar.r{right:20px}
.hx-info{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:clamp(24px,4vw,64px);background:linear-gradient(160deg,var(--black),#1a060b);border-left:1px solid #d9ac5222;transition:opacity .35s ease}
.hx-info.f{opacity:0}
.hx-eb{letter-spacing:.3em;font-size:.75rem;font-weight:700;color:var(--gold);text-transform:uppercase}
.hx-info h1{margin:0;font:600 clamp(2rem,4.2vw,3.6rem)/1.05 Cinzel,Georgia,serif;color:#fff}
.hx-pr{font-size:1.5rem;font-weight:700;color:var(--gold2)}
.hx-info p{margin:0;font-size:1.05rem;line-height:1.6;max-width:30em;min-height:1.6em}
.hx-cta{margin-top:6px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--black);border:0;border-radius:6px;padding:17px 20px;font-weight:800;letter-spacing:.2em;font-size:.9rem;cursor:pointer;width:min(100%,440px);text-transform:uppercase;box-shadow:0 8px 22px #0008}
.hx-cta:hover{filter:brightness(1.08)}.hx-info .sold{width:min(100%,440px)}
.hx-more{background:none;border:0;padding:0;text-align:left;color:var(--gold);font-weight:700;font-size:.8rem;letter-spacing:.2em;cursor:pointer}
.hx-tabs{display:flex;overflow-x:auto;background:var(--black);border-top:1px solid #d9ac5244;border-bottom:1px solid #d9ac5244;scrollbar-width:none;position:relative}
.hx-tabs::-webkit-scrollbar{display:none}
.hx-tabs button{position:relative;flex:1 0 auto;background:none;border:0;border-right:1px solid #ffffff14;color:#cfc3a8;padding:20px 26px;font-weight:700;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.hx-tabs button.on{color:#fff}
.hx-tabs button i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold)}
.hx-tabs button.on i{width:100%;animation:hxpg 5s linear forwards}
@keyframes hxpg{from{width:0}to{width:100%}}

.exc{padding:60px clamp(24px,7vw,120px) 0}

.xc{position:relative;display:flex;flex-direction:column;background:#14100e;border:1px solid #d9ac5244;border-radius:14px;overflow:hidden;cursor:pointer}
.xbig{grid-column:1/3;grid-row:1/3}
.xi{position:relative;aspect-ratio:1/1;overflow:hidden;background:#000}

.xn{position:absolute;top:10px;left:10px;z-index:3;background:rgba(10,5,6,.82);color:var(--gold2);font-size:.68rem;font-weight:700;letter-spacing:.14em;padding:4px 8px;border-radius:6px}

.xp{font-weight:700;font-size:1.1rem;color:var(--gold2)}

#mg{aspect-ratio:auto;overflow:visible;display:flex;flex-direction:column;gap:10px;border-radius:0}

}

async function compress(f,maxW){
  if(f.type==="image/gif"||!window.createImageBitmap){return f;}
  try{
    var bm=await createImageBitmap(f,{imageOrientation:"from-image"});
    var sc=Math.min(1,maxW/Math.max(bm.width,bm.height)),w=Math.round(bm.width*sc),h=Math.round(bm.height*sc);
    var cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(bm,0,0,w,h);if(bm.close){bm.close();}
    var b=await new Promise(function(r){cv.toBlob(r,"image/webp",0.82);});
    if(!b||b.type!=="image/webp"){b=await new Promise(function(r){cv.toBlob(r,"image/jpeg",0.85);});}
    return (b&&b.size<f.size)?b:f;
  }catch(e){return f;}
}
function extOf(t){return t==="image/webp"?"webp":(t==="image/png"?"png":(t==="image/gif"?"gif":"jpg"));}
async function upload(files){
  var out=[];
  for(var i=0;i<files.length;i++){
    setStatus("Optimizando y subiendo "+(i+1)+"/"+files.length+"…");
    var f=await compress(files[i],1600);
    if(f.size>5242880){setStatus((files[i].name||"La imagen")+" pesa más de 5 MB");continue;}
    var path="img/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+extOf(f.type);
    var r=await SB.storage.from(BUCKET).upload(path,f,{cacheControl:"31536000",contentType:f.type||undefined});
    if(r.error){setStatus("No se pudo subir "+(files[i].name||"la imagen")+": "+r.error.message);continue;}
    out.push(SB.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
  }
  if(out.length){setStatus("Imágenes subidas. Guarda los cambios.");}
  return out;
}

  S.products=p1.data.map(function(r){return {id:r.id,name:r.name,price:Number(r.price),stock:r.stock==null?"":r.stock,out:r.sold_out,arch:r.archived,d:r.description||"",imgs:(r.product_images||[]).slice().sort(function(a,b){return a.sort_order-b.sort_order;}).map(function(x){return x.url;}),c1:r.color1,c2:r.color2,s:r.symbol,hero:!!r.in_hero,hero_o:r.hero_order||0,exc:!!r.in_exclusive,exc_o:r.exclusive_order||0};});
  S.dbIds=S.products.map(function(p){return p.id;});S.nextId=1000000000;
}
async function saveAll(){
  var P=S.products,u;
  u=await SB.from("site_settings").upsert({id:1,hero_sup:S.hero.sup,hero_title:S.hero.title,hero_sub:S.hero.sub,brand:S.brand,footer:S.foot,logo_url:S.logo||"",about_title:S.about.title,about_head:S.about.head,about_text:S.about.text,loc_title:S.loc.title,loc_address:S.loc.address,loc_map_url:S.loc.map,wa_number:S.contact.wa,wa_label:S.contact.waLabel,tiktok_url:S.contact.tt,tiktok_name:S.contact.ttName,wa_msg_cart:S.contact.msgCart,wa_msg_info:S.contact.msgInfo});
  if(u.error){throw u.error;}
  u=await SB.from("carousel_images").delete().gte("id",0);if(u.error){throw u.error;}
  if(S.carousel.length){u=await SB.from("carousel_images").insert(S.carousel.map(function(url,i){return {url:url,sort_order:i};}));if(u.error){throw u.error;}}
  var keep=P.map(function(p){return p.id;});
  var gone=S.dbIds.filter(function(id){return keep.indexOf(id)<0;});
  if(gone.length){u=await SB.from("products").delete().in("id",gone);if(u.error){throw u.error;}}
  function row(p,i){return {name:p.name,price:Number(p.price)||0,stock:(p.stock===""||p.stock==null)?null:Math.max(0,Math.floor(Number(p.stock)||0)),sold_out:!!p.out,archived:!!p.arch,sort_order:i,description:p.d||"",color1:p.c1||null,color2:p.c2||null,symbol:p.s||null,in_hero:!!p.hero,in_exclusive:!!p.exc,hero_order:p.hero_o||0,exclusive_order:p.exc_o||0};}
  var ex=[],nw=[];
  P.forEach(function(p,i){var r=row(p,i);if(S.dbIds.indexOf(p.id)>-1){r.id=p.id;ex.push(r);}else{nw.push({p:p,r:r});}});
  if(ex.length){u=await SB.from("products").upsert(ex);if(u.error){throw u.error;}}
  for(var k=0;k<nw.length;k++){u=await SB.from("products").insert(nw[k].r).select("id").single();if(u.error){throw u.error;}nw[k].p.id=u.data.id;}
  var ids=P.map(function(p){return p.id;});
  if(ids.length){u=await SB.from("product_images").delete().in("product_id",ids);if(u.error){throw u.error;}}
  var rows=[];P.forEach(function(p){(p.imgs||[]).forEach(function(url,i){rows.push({product_id:p.id,url:url,sort_order:i});});});
  if(rows.length){u=await SB.from("product_images").insert(rows);if(u.error){throw u.error;}}
}
async function publishNow(){

  setStatus("Guardando…");$("spn").classList.add("on");

}

async function doLogin(){
  var u=$("lid").value.trim(),email=u.indexOf("@")>-1?u:(u.toLowerCase()==="deck house"?ADMIN_EMAIL:"");
  if(!email){$("lerr").textContent="Usuario o contraseña incorrectos.";return;}

    openAdmin();
  }catch(x){$("lerr").textContent="No se pudo conectar. Intenta de nuevo.";}
}
